[project]
name = "hospital-siting"
version = "0.2.0"
description = "Onde construir hospitais gerais: pipeline de dados (Fase 1) e otimizador com API (Fase 2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Núcleo: o que a API/otimizador (Fase 2) precisa. A imagem de deploy instala só isto.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pulp>=4.2.0",
    "highspy>=1.16.0",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Pipeline de dados (Fase 1): coleta, transformação e carga da gold. Airflow e CI instalam este extra.
pipeline = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "geobr>=0.2.2",
    "pandera>=0.20",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "datasus-dbc>=0.1",
    "dbfread>=2.0",
    "openpyxl>=3.1",
    "geoalchemy2>=0.15",
    "py7zr>=0.22",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "respx>=0.21",
    "dbf>=0.99",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_siting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
markers = [
    "online: acessa fontes reais na internet (fora do CI)",
    "db: exige PostgreSQL/PostGIS rodando",
]
