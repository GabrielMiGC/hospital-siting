# Deploy da Fase 2 (KVM2 via Dokploy, ou local): PostGIS com a gold restaurada do snapshot + API/interface.
# Airflow e OSRM nunca rodam no servidor: ele recebe só a gold pronta (spec §11).
#
# Local:   docker compose -f docker-compose.deploy.yml up -d --build   ->  http://localhost:8080
# Servidor: copie o snapshot uma vez (scp dist/gold_snapshot_fase2.sql.gz servidor:/srv/hospital-siting/) e defina
#           HS_SNAPSHOT=/srv/hospital-siting/gold_snapshot_fase2.sql.gz e POSTGRES_PASSWORD nas variáveis do Dokploy.
#           O endereço público vem do domínio gerado pelo Dokploy, apontado para o serviço "api", porta 8000.

name: hospital-siting-deploy  # distinto do compose de desenvolvimento (que tem o serviço "postgis" com a gold local)

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: hospital_siting
    volumes:
      - gold:/var/lib/postgresql/data
      # Restaurado só no primeiro boot (volume vazio), depois do script da imagem que cria a extensão PostGIS.
      - ${HS_SNAPSHOT:-./dist/gold_snapshot_fase2.sql.gz}:/docker-entrypoint-initdb.d/20-gold.sql.gz:ro
    healthcheck:
      # Consulta pela rede: durante a restauração o Postgres só escuta no socket, então pg_isready mentiria.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -d hospital_siting -tAc 'SELECT 1 FROM gold.dim_municipio LIMIT 1' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      HS_PG_DSN: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgis:5432/hospital_siting
      HS_PRECALCULAR: ${HS_PRECALCULAR:-1}
    expose:
      - "8000"
    ports:
      # Só na interface local do host: o tráfego público chega pelo Traefik do Dokploy.
      - "127.0.0.1:${HS_API_PORT:-8080}:8000"

volumes:
  gold:
